name: Release Desktop

# Builds + uploads the macOS .app + DMG for the Tauri desktop client.
# Triggered on tags matching v*.
#
# Two paths:
#   - SIGNED   — when ALL Apple Developer secrets are present, the build
#     is code-signed, notarized, and stapled. Users can launch the app
#     by double-clicking with no Gatekeeper warning.
#   - UNSIGNED — when secrets are missing, we still build + upload an
#     ad-hoc-signed DMG so users can install today. They'll need to
#     bypass Gatekeeper once (System Settings -> Privacy & Security ->
#     "Open anyway", or right-click -> Open).
#
# Required secrets for the SIGNED path:
#   APPLE_DEVELOPER_ID_CERT_P12    — base64-encoded .p12 of the
#                                    Developer ID Application cert.
#   APPLE_DEVELOPER_ID_CERT_PASS   — password for the .p12.
#   APPLE_NOTARY_APPLE_ID          — Apple ID with notarization rights.
#   APPLE_NOTARY_TEAM_ID           — 10-char Apple team ID.
#   APPLE_NOTARY_APP_PASSWORD      — app-specific password for notarytool.
#   TAURI_UPDATER_PRIVATE_KEY      — base64 of the Tauri updater
#                                    Ed25519 private key.
#   TAURI_UPDATER_KEY_PASSWORD     — password for the updater key.
#
# The corresponding pub-key is embedded at build time via
# tauri.conf.json's plugins.updater.pubkey.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight (check signing creds)
    runs-on: ubuntu-latest
    outputs:
      signing-available: ${{ steps.check.outputs.signing-available }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}" ] && \
             [ -n "${{ secrets.APPLE_DEVELOPER_ID_CERT_PASS }}" ] && \
             [ -n "${{ secrets.APPLE_NOTARY_APPLE_ID }}" ] && \
             [ -n "${{ secrets.APPLE_NOTARY_TEAM_ID }}" ] && \
             [ -n "${{ secrets.APPLE_NOTARY_APP_PASSWORD }}" ]; then
            echo "signing-available=true" >> "$GITHUB_OUTPUT"
            echo "All Apple signing credentials present — building SIGNED path."
          else
            echo "signing-available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple Developer ID secrets not configured. Building UNSIGNED DMG."
          fi

  build-macos:
    name: Build macOS .app + DMG
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Cache layers below cut warm-build time from ~9 min to ~2-3 min.
      # ALL THREE are release-safe: caches only memoize *dependencies*,
      # never the workspace crate's own compilation. Source changes
      # always trigger a fresh compile of the user code; cache hits only
      # skip recompiling unchanged deps (keyed on lockfile content).
      # If you bump deps (Cargo.lock / package-lock.json / go.sum), the
      # cache misses and the build is fully cold — same as before.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # setup-go@v5 auto-caches ~/.cache/go-build + ~/go/pkg/mod
          # when given cache-dependency-path. Keyed on go.sum content;
          # source changes don't poison the cache because go build
          # recomputes per-source-hash artifacts.
          cache-dependency-path: |
            go.sum
            clients/desktop/src-tauri/Cargo.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # cache: 'npm' caches ~/.npm (the package tarball store), NOT
          # node_modules. npm install still runs every time and rebuilds
          # node_modules fresh from the cached tarballs. Safe by design.
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            clients/desktop/package-lock.json

      - name: Set up Rust
        # Apple-Silicon only. Intel macOS support was dropped 2026-05-09
        # — no Intel users on the active fleet, and dual-arch lipo + DMG
        # variants doubled CI time + bundle size for ~0% of installs.
        # If demand surfaces (verifiable Intel-Mac user reports), the
        # x86_64 target add + lipo + DMG-arch-x86_64 path is one short
        # commit away; the build-dmg.sh script keeps the per-arch
        # naming convention so a second DMG could co-publish later.
        run: rustup target add aarch64-apple-darwin

      # Swatinem/rust-cache@v2 caches ~/.cargo/registry, ~/.cargo/git,
      # and target/ keyed on Cargo.lock + rustflags + rustc version.
      # CRITICAL release-safety property: the workspace crate itself
      # is ALWAYS recompiled — only dependency crates come from cache.
      # When you push a tag with new Rust source, the new source is
      # compiled fresh; only unchanged deps (the slow part) are reused.
      # save-if: success ensures we don't poison the cache from a
      # broken build.
      - name: Cache Rust deps + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri
          # Single shared key across all release builds — keep it simple,
          # the action's internal keying on Cargo.lock + rustflags is
          # what guards correctness.
          shared-key: desktop-release
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Vendor + patch
        run: make setup

      - name: "Build hop-agent (darwin/arm64 only)"
        run: |
          mkdir -p clients/desktop/src-tauri/binaries
          # Bake clientType=desktop so the dashboard renders "🖥 Desktop"
          # for nodes running this binary (vs "⌨ CLI" for `make build`
          # standalone binaries).
          LDFLAGS='-s -w -X github.com/trustos/hopssh/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/trustos/hopssh/internal/buildinfo.ClientType=desktop'
          GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags="$LDFLAGS" \
            -o clients/desktop/src-tauri/binaries/hop-agent ./cmd/agent

      # ---- SIGNED PATH ----
      - name: Import Developer ID cert
        if: needs.preflight.outputs.signing-available == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          P12_PASS: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASS }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions-tmp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions-tmp build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions-tmp build.keychain
          rm /tmp/cert.p12

      - name: Sign hop-agent binary (pre-bundle)
        if: needs.preflight.outputs.signing-available == 'true'
        run: |
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" \
            clients/desktop/src-tauri/binaries/hop-agent

      - name: Build Tauri app + DMG (SIGNED)
        if: needs.preflight.outputs.signing-available == 'true'
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application"
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        working-directory: clients/desktop
        run: |
          npm install --no-audit --no-fund
          npm run build:dmg

      - name: Verify codesign + notary stapling
        if: needs.preflight.outputs.signing-available == 'true'
        run: |
          APP=clients/desktop/src-tauri/target/release/bundle/macos/hopssh.app
          DMG=$(find clients/desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --verbose --type execute "$APP"
          if [ -n "$DMG" ]; then
            spctl --assess --verbose --type install "$DMG"
            xcrun stapler validate "$DMG"
          fi

      # ---- UNSIGNED PATH ----
      - name: Build Tauri app + DMG (UNSIGNED, ad-hoc)
        if: needs.preflight.outputs.signing-available != 'true'
        working-directory: clients/desktop
        run: |
          npm install --no-audit --no-fund
          npm run build:dmg

      # ---- COMMON UPLOAD ----
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Apple-Silicon-only since 2026-05-09. The stable-named DMG
          # (hopssh-macos-aarch64.dmg) is what the dashboard /download
          # page links to + what install-mac.sh fetches; the version-
          # tagged sibling (hopssh_<version>_aarch64.dmg) is for
          # archival on the GitHub release page.
          files: |
            clients/desktop/src-tauri/target/release/bundle/dmg/hopssh-macos-aarch64.dmg
            clients/desktop/src-tauri/target/release/bundle/dmg/hopssh_*_aarch64.dmg
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false

  # Stage 5 — Windows desktop foundation. Builds .msi + NSIS installer
  # via Tauri 2's bundle pipeline. STATUS: foundation only. CI builds
  # are INFORMATIONAL — failures don't block the macOS release path
  # (which is the production user-facing channel). Hardware-verified
  # Windows builds become a hard requirement when this stage gets
  # promoted from foundation to production.
  # Tracking gaps in docs/wiki/decisions/client-windows-linux-architecture.md.
  build-windows:
    name: Build Windows ${{ matrix.tauri_arch }} MSI + NSIS (informational)
    continue-on-error: true
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-pc-windows-msvc
            goarch: amd64
            tauri_arch: x86_64
          - rust_target: aarch64-pc-windows-msvc
            goarch: arm64
            tauri_arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: |
            go.sum
            clients/desktop/src-tauri/Cargo.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            clients/desktop/package-lock.json

      - name: Add Rust target
        # x86_64-pc-windows-msvc is always present on windows-latest;
        # rustup is a no-op for it. aarch64-pc-windows-msvc is added
        # on demand for the ARM64 cross-compile.
        run: rustup target add ${{ matrix.rust_target }}

      - name: Cache Rust deps + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri
          # Per-arch cache key — x86_64 + aarch64 cross-compiled output
          # trees diverge after the rustup target add.
          shared-key: desktop-release-windows-${{ matrix.tauri_arch }}
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Vendor + patch
        shell: bash
        run: make setup

      - name: Build hop-agent.exe (${{ matrix.goarch }})
        shell: bash
        run: |
          mkdir -p clients/desktop/src-tauri/binaries
          LDFLAGS='-s -w -X github.com/trustos/hopssh/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/trustos/hopssh/internal/buildinfo.ClientType=desktop'
          GOOS=windows GOARCH=${{ matrix.goarch }} go build -mod=vendor -ldflags="$LDFLAGS" \
            -o clients/desktop/src-tauri/binaries/hop-agent.exe ./cmd/agent
          file clients/desktop/src-tauri/binaries/hop-agent.exe || true

      - name: Build Tauri MSI + NSIS (--target ${{ matrix.rust_target }})
        working-directory: clients/desktop
        # `tauri build --target X` cross-compiles the Rust shell to X
        # AND tells WiX/NSIS to produce arch-suffixed bundle filenames
        # (hopssh_0.1.0_arm64_en-US.msi vs hopssh_0.1.0_x64-setup.exe).
        run: |
          npm install --no-audit --no-fund
          npm run tauri build -- --target ${{ matrix.rust_target }} --bundles msi,nsis

      # Tauri emits version-tagged filenames (hopssh_0.1.0_x64-setup.exe).
      # Copy them to STABLE names the dashboard + install scripts link to
      # without per-version churn. The Tauri target dir for cross-compiled
      # builds is target/<rust_target>/release/bundle/, NOT target/release/
      # bundle/. Use that path explicitly.
      - name: Stable rename Windows artifacts (${{ matrix.tauri_arch }})
        shell: bash
        env:
          ARCH: ${{ matrix.tauri_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -x
          BUNDLE="clients/desktop/src-tauri/target/${RUST_TARGET}/release/bundle"
          MSI=$(find "$BUNDLE/msi" -name "*.msi" -print -quit 2>/dev/null || true)
          NSIS=$(find "$BUNDLE/nsis" -name "*-setup.exe" -print -quit 2>/dev/null || true)
          if [ -n "$MSI" ]; then cp "$MSI" "$BUNDLE/msi/hopssh-windows-${ARCH}.msi"; fi
          if [ -n "$NSIS" ]; then cp "$NSIS" "$BUNDLE/nsis/hopssh-windows-${ARCH}-setup.exe"; fi
          ls -la "$BUNDLE/msi/" "$BUNDLE/nsis/" 2>/dev/null || true

      - name: Upload Windows artifacts (${{ matrix.tauri_arch }})
        uses: softprops/action-gh-release@v2
        with:
          # Stable + version-tagged side-by-side. Stable is what the
          # dashboard links to; version-tagged sits on the release page
          # for archival.
          files: |
            clients/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/hopssh-windows-${{ matrix.tauri_arch }}.msi
            clients/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            clients/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/hopssh-windows-${{ matrix.tauri_arch }}-setup.exe
            clients/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*-setup.exe
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false

  # Stage 6 — Linux desktop foundation. Builds .deb + .rpm + AppImage
  # for BOTH x86_64 + aarch64 via Tauri 2's bundle pipeline.
  # STATUS: foundation only — informational on failure (the macOS
  # release path is the production user-facing channel until these are
  # hardware-verified).
  #
  # ARM64 added 2026-05-09 after a real Linux/aarch64 user (UTM Ubuntu
  # 25.10 on Apple Silicon) hit "cannot execute binary file: Exec format
  # error" trying to run the x86_64 AppImage. ARM64 Linux runners are
  # GitHub-hosted (ubuntu-22.04-arm); free for public repos.
  build-linux:
    name: Build Linux ${{ matrix.tauri_arch }} .deb + .rpm + AppImage (informational)
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goarch: amd64
            tauri_arch: x86_64
            # Full bundle set on x86_64 — appimagetool ships a native
            # x86_64 AppImage that Tauri can use to build the bundle.
            bundles: "deb,rpm,appimage"
          - runner: ubuntu-22.04-arm
            goarch: arm64
            tauri_arch: aarch64
            # AppImage bundler skipped on aarch64 — Tauri's AppImage
            # path drives appimagetool which historically ships only
            # an x86_64 AppImage that can't `exec` on arm64 hosts. We
            # ship .deb + .rpm only on aarch64 (sufficient for the
            # Ubuntu / Fedora / RHEL / openSUSE user base on ARM64
            # Linux). AppImage on aarch64 = follow-up phase that
            # downloads appimagetool-aarch64 explicitly.
            bundles: "deb,rpm"
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux deps
        # WebKit2GTK + GTK3 + AppIndicator dev libs. Pulled in via
        # tauri.conf.json's bundle.linux.deb.depends; the runtime list
        # is what end users need installed. Build-time list overlaps.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: |
            go.sum
            clients/desktop/src-tauri/Cargo.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            clients/desktop/package-lock.json

      - name: Cache Rust deps + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri
          # Distinct cache key per arch — x86_64 and aarch64 build
          # different Rust toolchains' compiled artifacts.
          shared-key: desktop-release-linux-${{ matrix.tauri_arch }}
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Vendor + patch
        run: make setup

      - name: Build hop-agent (Linux ${{ matrix.goarch }})
        run: |
          mkdir -p clients/desktop/src-tauri/binaries
          LDFLAGS='-s -w -X github.com/trustos/hopssh/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/trustos/hopssh/internal/buildinfo.ClientType=desktop'
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -mod=vendor -ldflags="$LDFLAGS" \
            -o clients/desktop/src-tauri/binaries/hop-agent ./cmd/agent

      - name: Build Tauri bundles (${{ matrix.bundles }})
        working-directory: clients/desktop
        run: |
          npm install --no-audit --no-fund
          npm run tauri build -- --bundles ${{ matrix.bundles }}

      # Stable-rename so the dashboard /download page can link to a
      # version-stable URL. Per-arch suffix lets x86_64 + aarch64
      # uploads coexist on the GitHub release page.
      - name: Stable rename Linux artifacts (${{ matrix.tauri_arch }})
        env:
          ARCH: ${{ matrix.tauri_arch }}
        run: |
          set -x
          BUNDLE=clients/desktop/src-tauri/target/release/bundle
          DEB=$(find "$BUNDLE/deb" -name "*.deb" -print -quit 2>/dev/null || true)
          RPM=$(find "$BUNDLE/rpm" -name "*.rpm" -print -quit 2>/dev/null || true)
          APPIMAGE=$(find "$BUNDLE/appimage" -name "*.AppImage" -print -quit 2>/dev/null || true)
          if [ -n "$DEB" ]; then cp "$DEB" "$BUNDLE/deb/hopssh-linux-${ARCH}.deb"; fi
          if [ -n "$RPM" ]; then cp "$RPM" "$BUNDLE/rpm/hopssh-linux-${ARCH}.rpm"; fi
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" "$BUNDLE/appimage/hopssh-linux-${ARCH}.AppImage"
            chmod +x "$BUNDLE/appimage/hopssh-linux-${ARCH}.AppImage"
          fi
          ls -la "$BUNDLE/deb/" "$BUNDLE/rpm/" 2>/dev/null || true
          ls -la "$BUNDLE/appimage/" 2>/dev/null || true

      - name: Upload Linux artifacts (${{ matrix.tauri_arch }})
        uses: softprops/action-gh-release@v2
        with:
          # Stable-named (dashboard-linkable) + Tauri-tagged (archival).
          # Both sit on the same GitHub release; per-arch suffix means
          # the matrix slots don't clobber each other's uploads.
          files: |
            clients/desktop/src-tauri/target/release/bundle/deb/hopssh-linux-${{ matrix.tauri_arch }}.deb
            clients/desktop/src-tauri/target/release/bundle/deb/*.deb
            clients/desktop/src-tauri/target/release/bundle/rpm/hopssh-linux-${{ matrix.tauri_arch }}.rpm
            clients/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            clients/desktop/src-tauri/target/release/bundle/appimage/hopssh-linux-${{ matrix.tauri_arch }}.AppImage
            clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
