name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vendor dependencies + apply patches
        run: make setup

      - name: Build frontend
        run: make frontend-embed

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Vendor dependencies + apply patches
        run: make setup

      - name: Build frontend
        run: make frontend-embed

      - name: Build linux/${{ matrix.goarch }}
        run: make build-linux GOARCH=${{ matrix.goarch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: |
            hop-agent-linux-${{ matrix.goarch }}
            hop-server-linux-${{ matrix.goarch }}

  check-patches:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check if Nebula patch is still needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: make check-patches
        continue-on-error: true

  # Phase NN+1 tripwire — verify the gomobile-bind path against
  # internal/client/. Catches FFI-shape regressions in api.go before
  # they break the iOS / Android targets (NN+2 / NN+3). The Android
  # target is fast (~30s); iOS needs full Xcode which Ubuntu runners
  # don't have, so we exercise Android only — sufficient because
  # gomobile rejects the same incompatible types regardless of target.
  gomobile-bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 ndk;26.1.10909125'

      - name: Vendor dependencies + apply patches
        run: make setup

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          echo "gomobile install OK"

      - name: Diagnostic — toolchain versions
        run: |
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          echo "=== ANDROID_NDK_HOME (forwarded): $ANDROID_HOME/ndk/26.1.10909125 ==="
          ls -la "$ANDROID_HOME/ndk/" || echo "no ndk dir"
          which gomobile || echo "no gomobile"
          which gobind || echo "no gobind"
          go env GOOS GOARCH GOPATH

      - name: Verify mobilehop module compiles (always green; doesn't need SDK)
        run: |
          cd clients/mobile-go
          make verify

      # The gomobile-bind step is INFORMATIONAL today (continue-on-error).
      # Phase NN+1 ship goal was the FFI surface validity, which is
      # already proven by the api_constraints_test.go reflection
      # tripwires + `make verify`. Producing the actual .aar artifact
      # via gomobile is a nice-to-have until we confirm the NDK 26
      # toolchain works against our patched vendor/ Nebula deps.
      # Failure here is a yellow flag, not a red one.
      - name: Build mobilehop AAR (informational)
        continue-on-error: true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          cd clients/mobile-go
          make android-aar

      - name: Upload AAR artifact (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobilehop-aar
          path: clients/mobile-go/dist/mobilehop.aar
          if-no-files-found: warn
          retention-days: 7
