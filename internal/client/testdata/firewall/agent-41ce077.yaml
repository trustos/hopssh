# The firewall block hopssh wrote for agents enrolled from 41ce077 (2026-04-07) on:
# cmd/agent/enroll.go at that commit; its %d is 41820. Do not edit: devices enrolled then
# still run it, since nothing rewrites the firewall section.
firewall:
  outbound:
    - port: any
      proto: any
      host: any
  inbound:
    # Control plane (admin group) can reach agent API
    - port: 41820
      proto: tcp
      groups:
        - admin
    # All mesh nodes can reach each other
    - port: any
      proto: tcp
      groups:
        - node
    # ICMP for diagnostics
    - port: any
      proto: icmp
      host: any
