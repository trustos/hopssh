<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="380" viewBox="0 0 540 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="540" height="380" fill="url(#bg)"/>

  <!-- Arrow from app -> applications -->
  <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="220" y1="200" x2="320" y2="200"/>
    <polyline points="305,188 320,200 305,212"/>
  </g>

  <!-- Title at top -->
  <text x="270" y="60" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
        font-size="22" font-weight="600" fill="#fafafa" text-anchor="middle">
    Install <tspan fill="#10b981">hop</tspan>ssh
  </text>

  <!-- Instructions below the icon row -->
  <text x="270" y="295" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif"
        font-size="13" fill="#a1a1aa" text-anchor="middle">
    Drag the hopssh icon onto the Applications folder
  </text>

  <text x="270" y="340" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif"
        font-size="11" fill="#71717a" text-anchor="middle">
    First launch: right-click hopssh.app → Open → Open
  </text>
</svg>
